[project]
name = "obsisync"
version = "0.1.0"
description = "Native desktop app to sync an Obsidian vault with iCloud Drive on Linux and Windows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # iCloud Drive access is vendored in icloudlite/ (a trimmed pyicloud fork),
    # so these are pyicloud's runtime needs minus fido2/pydantic-cloudkit/protobuf.
    "requests>=2.31",
    "srp>=1.0.20",
    "certifi",
    "tzlocal",
    "tinyhtml",
    "watchdog>=6.0",
    "keyring>=25.0",
    "click>=8.1",
    "platformdirs>=4.0",
    "PySide6>=6.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]
build = ["nuitka>=4.1"]

[project.scripts]
obsisync-cli = "sync:cli"

[project.urls]
Homepage = "https://github.com/biomassa/obsisync"
