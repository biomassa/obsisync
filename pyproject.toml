[project]
name = "obsisync"
version = "0.1.0"
description = "Native desktop app to sync an Obsidian vault with iCloud Drive on Linux and Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "icloudlite/LICENSE.pyicloud"]
requires-python = ">=3.11"
dependencies = [
    # iCloud Drive access is vendored in icloudlite/ (a trimmed pyicloud fork).
    # This list is exactly what icloudlite imports — tests/test_vendor.py checks
    # it against the source, because dropping pyicloud meant restating its
    # dependencies by hand and three were missed the first time.
    "requests>=2.31",
    "urllib3>=2.0",
    "srp>=1.0.20",
    "cryptography>=42.0",
    "pydantic>=2.0",
    "certifi",
    "watchdog>=6.0",
    "keyring>=25.0",
    "click>=8.1",
    "platformdirs>=4.0",
    "PySide6>=6.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]
build = ["nuitka>=4.1"]

[project.scripts]
obsisync-cli = "sync:cli"

[project.urls]
Homepage = "https://github.com/biomassa/obsisync"

# This is an application, not a library, so its layout is flat rather than src/.
# setuptools refuses to guess in that case and must be told explicitly, or
# `pip install -e .` fails with "Multiple top-level packages discovered".
[tool.setuptools]
packages = ["gui", "icloudlite", "icloudlite.services", "icloudlite.common"]
py-modules = [
    "obsisync", "sync", "sync_engine", "scanner", "conflict", "state_db",
    "auth", "filters", "watcher", "config", "paths", "build",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
